$kind: http-request
method: POST
url: 'http://localhost:5000/api/auth/change-password'
order: 130
headers:
  - key: Authorization
    value: 'Bearer {{jwt_token}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "old_password": "old-password",
      "new_password": "new-password"
    }
